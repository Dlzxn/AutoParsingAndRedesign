services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoparsing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-autoparsing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoparsing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoparsing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autoparsing}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Доступ только с этого сервера — снаружи через reverse proxy с HTTPS
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/var

volumes:
  pgdata:
  media:
