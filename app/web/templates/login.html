<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Parser Platform</title>
    <link rel="stylesheet" href="{{ static('css/auth.css') }}">
</head>
<body>
    <div class="container">
        <header>Вход</header>
        <form id="authForm" data-endpoint="/api/login" data-next="{{ next_url }}" novalidate>
            <div class="input-box">
                <label for="identity">Email или телефон</label>
                <input type="text" id="identity" name="identity" autocomplete="username" required>
            </div>

            <div class="input-box">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <div class="error-message" id="authError" role="alert"></div>
            <div class="success-message" id="authSuccess"></div>

            <button type="submit" class="button">Войти</button>
        </form>
        <div class="switch-form">
            Нет аккаунта? <a href="/registration{% if next_url != '/' %}?next={{ next_url|urlencode }}{% endif %}">Зарегистрироваться</a>
        </div>
    </div>
    <script src="{{ static('js/auth.js') }}"></script>
</body>
</html>
