{% extends "base.html" %}

{% block styles %}
  <link rel="stylesheet" href="{{ static('css/tarif_adm.css') }}">
{% endblock %}

{% block content %}
<div class="pricing-container">
  <h1>Управление тарифными планами</h1>

  <div class="tariffs-grid" id="tariffsContainer">
    <!-- Динамически загружаемые тарифы -->
  </div>

  <div class="controls">
    <button class="btn-save-all" onclick="saveAllTariffs()">💾 Сохранить все изменения</button>
    <button class="btn-reload" onclick="loadTariffs()">🔄 Загрузить текущие настройки</button>
  </div>
</div>

<!-- Шаблон тарифа -->
<template id="tariffTemplate">
  <div class="tariff-card">
    <h2 class="tariff-name"></h2>
    <div class="tariff-body">
      <div class="form-group">
        <label>Базовая цена (руб):</label>
        <input type="number" class="price-input" min="0">
      </div>

      <div class="form-group">
        <label>Скачиваний в день (пусто — без лимита):</label>
        <input type="number" class="tokens-input" min="0">
      </div>

      <div class="sale-group">
        <label class="switch">
          <input type="checkbox" class="sale-toggle">
          <span class="slider"></span>
        </label>
        <span class="sale-label">Акция</span>
        <input type="number" class="new-price-input" min="0" placeholder="Цена по акции">
      </div>
    </div>
  </div>
</template>
{% endblock %}

{% block extra_scripts %}
  <script src="{{ static('js/tarif_adm.js') }}"></script>
{% endblock %}
