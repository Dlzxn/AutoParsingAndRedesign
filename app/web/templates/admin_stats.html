{% extends "base.html" %}

{% block title %}Статистика — админ-панель{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ static('css/admin_panel.css') }}">
<style>
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .stat-label { color: var(--muted); margin-top: 4px; }
  .stat-list { list-style: none; margin-top: 10px; }
  .stat-list li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
</style>
{% endblock %}

{% block content %}
<div class="admin-container">
  <h1 class="admin-title">Статистика</h1>
  <div class="stats-grid" data-stats><p>Загрузка…</p></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  (async () => {
    const box = document.querySelector('[data-stats]');
    const STATUS = { queued: 'В очереди', processing: 'В работе', done: 'Готово', failed: 'Ошибки' };
    try {
      const s = await App.request('/api/admin/stats');
      const list = (obj, names = {}) => `<ul class="stat-list">${Object.entries(obj).map(([k, v]) =>
        `<li><span>${App.escapeHtml(names[k] || k)}</span><b>${v}</b></li>`).join('') || '<li>—</li>'}</ul>`;
      box.innerHTML = `
        <div class="stat"><div class="stat-value">${s.users_total}</div><div class="stat-label">Пользователей (из них админов: ${s.admins})</div>${list(s.users_by_plan)}</div>
        <div class="stat"><div class="stat-value">${s.renders_last_24h}</div><div class="stat-label">Роликов смонтировано за 24 часа</div>${list(s.renders_by_status, STATUS)}</div>
        <div class="stat"><div class="stat-value">${s.render_queue}</div><div class="stat-label">Задач в очереди рендера сейчас</div></div>
        <div class="stat"><div class="stat-value">${Object.values(s.clips_by_platform).reduce((a, b) => a + b, 0)}</div><div class="stat-label">Клипов просмотрено/скачано</div>${list(s.clips_by_platform)}</div>`;
    } catch (err) {
      box.innerHTML = `<p>${App.escapeHtml(err.message)}</p>`;
    }
  })();
</script>
{% endblock %}
