[project]
name = "autoparsing"
version = "2.0.0"
description = "Поиск коротких видео на платформах и онлайн-редактор клипов"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: тесты с реальными запросами к внешним API (запуск: pytest -m live)",
    "ffmpeg: тесты с реальным рендером через ffmpeg",
    "e2e: сквозные тесты в браузере (нужен Chrome)",
]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
omit = ["app/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
